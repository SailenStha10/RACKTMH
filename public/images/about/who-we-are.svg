<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0f0f0f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#D41367"/>
      <stop offset="100%" style="stop-color:#F7A81B"/>
    </linearGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
  <rect x="50" y="50" width="700" height="900" rx="12" fill="rgba(255,255,255,0.02)" stroke="rgba(212,19,103,0.2)" stroke-width="1"/>
  <circle cx="400" cy="350" r="120" fill="none" stroke="url(#accent)" stroke-width="2" stroke-dasharray="15,10"/>
  <text x="400" y="355" font-family="system-ui, sans-serif" font-size="14" fill="rgba(255,255,255,0.4)" text-anchor="middle">Club Members</text>
  <text x="400" y="520" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="url(#accent)" text-anchor="middle">WHO WE ARE</text>
  <text x="400" y="560" font-family="system-ui, sans-serif" font-size="13" fill="rgba(255,255,255,0.5)" text-anchor="middle">Authentic club photograph</text>
  <text x="400" y="900" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.3)" text-anchor="middle">Replace with actual club members photo from Instagram</text>
</svg>